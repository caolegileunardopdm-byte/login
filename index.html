<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar">
      <div class="nav-links">
        <a href="index.html">Home</a> <a href="profile.html">Profile</a>
        <a href="about.html">About</a>
        <a href="register.html" class="active">Sign in</a>
      </div>
    </nav>
    <main class="card">
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to your account</p>

      <form id="loginForm">
        <label>Email</label>
        <input type="email" id="email" required />

        <label>Password</label>
        <input type="password" id="password" required />

        <button type="submit">Login</button>
        <p id="message"></p>
      </form>

      <p>
        Don't have an account?
        <a href="register.html" id="showRegister">Register</a>
      </p>
    </main>
  </body>
</html>
