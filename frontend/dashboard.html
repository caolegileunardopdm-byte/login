<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TaskFlow - Dashboard</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="dashboard-page">
    <!-- Dashboard Navigation -->

    <nav class="dashboard-nav">
      <div class="logo">TaskFlow</div>

      <div class="dashboard-user">
        <span id="userName"> User </span>

        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </nav>

    <!-- Dashboard -->

    <main class="dashboard-container">
      <!-- Welcome -->

      <section class="welcome-section">
        <div>
          <p class="small-text">Dashboard</p>

          <h1>
            Welcome,
            <span id="welcomeName"> User </span>!
          </h1>

          <p>Here's what's happening with your tasks today.</p>
        </div>
      </section>

      <!-- Statistics -->

      <section class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon purple">✓</div>

          <div>
            <p>Total Tasks</p>

            <h2 id="totalTasks">0</h2>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon green">✓</div>

          <div>
            <p>Completed</p>

            <h2 id="completedTasks">0</h2>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon orange">!</div>

          <div>
            <p>Pending</p>

            <h2 id="pendingTasks">0</h2>
          </div>
        </div>
      </section>

      <!-- Tasks -->

      <section class="dashboard-card">
        <div class="card-header">
          <div>
            <h2>My Tasks</h2>

            <p>Manage your daily activities.</p>
          </div>

          <button id="addTaskBtn" class="primary-btn">+ Add Task</button>
        </div>

        <div id="taskList" class="dashboard-task-list">
          <!-- Tasks generated by JavaScript -->
        </div>
      </section>
    </main>

    <!-- Add Task Modal -->

    <div id="taskModal" class="modal hidden">
      <div class="modal-box">
        <h2>Add New Task</h2>

        <form id="taskForm">
          <label for="taskTitle"> Task Title </label>

          <input
            type="text"
            id="taskTitle"
            placeholder="Example: Study JavaScript"
            required
          />

          <label for="taskDescription"> Description </label>

          <textarea
            id="taskDescription"
            placeholder="Task description..."
          ></textarea>

          <div class="modal-buttons">
            <button type="button" id="cancelTaskBtn" class="secondary-btn">
              Cancel
            </button>

            <button type="submit" class="primary-btn">Add Task</button>
          </div>
        </form>
      </div>
    </div>

    <script src="dashboard.js"></script>
  </body>
</html>
